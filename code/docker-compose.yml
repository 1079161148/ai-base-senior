# S8 · 一键起全栈：app + pgvector。
#
# 本地开发通常只起 pgvector（docker compose up -d pgvector），
# 后端用 uv run 跑在宿主机上，改代码即时生效。
# 完整拉起用：docker compose up -d --build
services:
  pgvector:
    image: pgvector/pgvector:pg17
    container_name: agent-lab-pg
    environment:
      POSTGRES_DB: agent_lab
      POSTGRES_USER: agent_lab
      POSTGRES_PASSWORD: agent_lab
    ports:
      - "5433:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U agent_lab -d agent_lab"]
      interval: 5s
      timeout: 3s
      retries: 3

  app:
    build:
      context: ./agent-lab
    container_name: agent-lab-app
    # LLM_API_KEY 等密钥只从 .env 读，绝不写进 compose（compose 文件会进版本库）
    env_file:
      - ./agent-lab/.env
    environment:
      # 容器内用服务名连库，覆盖 .env 里指向 127.0.0.1 的本地配置
      PG_DSN: postgresql://agent_lab:agent_lab@pgvector:5432/agent_lab
      # 这是对外提供服务的形态，鉴权必须开 —— 显式写死而不是靠 .env，
      # 因为本地跑的 .env 常常是 AUTH_ENABLED=false（图省事不登录）。
      # AUTH_SECRET 仍然从 .env 注入，不写进这个文件（它会进版本库）。
      AUTH_ENABLED: "true"
    ports:
      - "8001:8001"
    volumes:
      # SQLite 和 trace 文件挂出来：容器重建不会丢会话历史
      - ./agent-lab/data:/app/data
    depends_on:
      pgvector:
        # 等 pg_isready 通过再启动，否则第一次连库必然失败
        condition: service_healthy
    restart: unless-stopped
    # 资源上限：一条失控的生成任务不该把整台机器拖死
    deploy:
      resources:
        limits:
          memory: 1G

volumes:
  pgdata:

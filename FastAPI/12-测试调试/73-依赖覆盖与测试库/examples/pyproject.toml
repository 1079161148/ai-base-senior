[project]
name = "ch73-dependency-overrides"
version = "0.1.0"
description = "第 73 章 · 依赖覆盖与测试库：可独立运行的示例项目"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.146.0",
    "uvicorn[standard]>=0.54.0",
    "pydantic>=2.14.0",
]

# 示例代码不是要打包发布的库，uv 不尝试构建它
[tool.uv]
package = false

[dependency-groups]
dev = ["httpx>=0.28.1", "httpx2>=2.16.2", "pytest>=8.4.0"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-q"
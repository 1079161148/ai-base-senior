[project]
name = "ch11-header-params"
version = "0.1.0"
description = "第 11 章 · Header 参数：可独立运行的示例项目"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.146.0",
    "uvicorn[standard]>=0.54.0",
    "pydantic>=2.14.0",
]

# 示例代码不是要发布的包，uv 不尝试构建它
[tool.uv]
package = false

[dependency-groups]
# 【作用】TestClient 依赖 httpx；只在本章运行 verify.py 时需要
dev = ["httpx>=0.28.1"]

[project]
name = "fastapi-tutorial"
version = "0.1.0"
description = "FastAPI 79 章实战教程的共用运行环境"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.146.0",
    "uvicorn[standard]>=0.54.0",
    "pydantic>=2.14.0",
    "pydantic-settings>=2.16.0",
    "httpx>=0.28.1",
]

# 教程本身不是要发布的包，声明为虚拟项目，uv sync 不尝试构建它
[tool.uv]
package = false

# 【作用】把每一章的 examples/ 注册成 workspace 成员：
#         - 每章有独立 pyproject.toml，可单独 `uv run`（独立项目的形态）
#         - 所有成员共享根目录这一份 lock 与 .venv，避免 79 个虚拟环境重复下载
# 【注意】members 用 glob，新增章节目录无需改这里
[tool.uv.workspace]
# 【作用】`模块/章节/examples` 两级通配，新增章节与新增模块都不用改这里
members = ["*/*/examples"]

# 测试与表单/文件相关依赖放 dev 组：
# - pytest / pytest-asyncio：M12 全部测试章节
# - python-multipart：M04 表单与文件、M07 OAuth2 表单登录
[dependency-groups]
dev = [
    "httpx2>=2.16.2",
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
    "python-multipart>=0.0.20",
]

[tool.pytest.ini_options]
# 从教程根目录递归收集，后续新增模块目录自动纳入，不需要改配置
asyncio_mode = "auto"

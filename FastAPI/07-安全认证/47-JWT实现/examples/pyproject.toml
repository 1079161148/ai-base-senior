[project]
name = "ch47-jwt-hs256"
version = "0.1.0"
description = "第 47 章 · JWT 实现（手写 HS256）：可独立运行的示例项目"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.146.0",
    "uvicorn[standard]>=0.54.0",
    "pydantic>=2.14.0",
    # 【作用】/token 用 OAuth2PasswordRequestForm 收表单
    "python-multipart>=0.0.34",
]

# 示例代码不是要打包发布的库，uv 不尝试构建它
[tool.uv]
package = false

[dependency-groups]
# 【作用】TestClient 依赖 HTTP 客户端；Starlette ≥1.10 用 httpx2，旧版用 httpx
dev = ["httpx>=0.28.1", "httpx2>=2.16.2"]
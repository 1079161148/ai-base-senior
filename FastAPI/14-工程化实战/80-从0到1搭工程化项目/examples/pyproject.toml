[project]
name = "ch80-scaffold"
version = "0.1.0"
description = "第 80 章 · 从 0 到 1 搭工程化 FastAPI 项目"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.146.0",
    "uvicorn[standard]>=0.54.0",
    "pydantic>=2.14.0",
    "pydantic-settings>=2.13.0",
]

# 示例不是要发布的库，uv 不尝试构建
[tool.uv]
package = false

[dependency-groups]
dev = ["httpx>=0.28.1", "httpx2>=2.16.2", "pytest>=8.4.0"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-q"
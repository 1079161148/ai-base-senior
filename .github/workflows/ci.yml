name: CI

# 三个 job，按「快 → 慢 → 花钱」排：
#   backend    单测 + 静态检查，不需要模型，每次 PR 都跑（秒级反馈）
#   frontend   类型检查 + 打包，不需要模型，每次 PR 都跑
#   eval-gate  真实跑评测集，要模型 Key 和真金白银，只在配了变量时跑
#
# 为什么分成三个而不是一个 job：前端改一行 CSS 不该等后端装满依赖，
# 后端改一个函数也不该触发 npm install。并行的反馈才快。

on:
  # 这个仓库的主分支叫 master（不是 main）。
  # 写成 [main] 会导致 push 后 CI 一声不响地不触发 —— 比报错更难发现。
  # 两个都列上，仓库改名或迁移不用再动这一行。
  push:
    branches: [main, master]
  pull_request:

# 最小权限。默认 token 是读写全仓库的，而 CI 只需要读代码 ——
# 一旦某个依赖被投毒，它能做的事就被限制在这一个权限内。
permissions:
  contents: read

# 同一个 PR 连续推送时取消上一次未完成的运行。
# 不设的话，几次 force-push 会并行跑好几份，既烧额度，
# 又让人分不清哪个结果对应哪次提交。
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: 后端 · 单测 + 静态检查
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: code/agent-lab
    steps:
      - uses: actions/checkout@v4

      - name: 安装 uv
        uses: astral-sh/setup-uv@v5
        with:
          version: "0.8.x"
          # 缓存 uv 的下载缓存：第二次起省 30~60 秒。
          # key 绑在 uv.lock 上，依赖没变就命中，变了自动重建。
          enable-cache: true
          cache-dependency-glob: code/agent-lab/uv.lock

      - name: 安装依赖
        # --frozen：严格按 uv.lock 装，不重新解析版本。
        # 谁改了 pyproject 却忘了 uv lock，这里会直接失败 —— 这正是我们要的，
        # 否则本地和 CI 会悄悄跑在不同版本上。
        run: uv sync --frozen --group dev

      - name: 静态检查
        # 规则集固定在 pyproject.toml 的 [tool.ruff.lint] 里，
        # 不随 ruff 版本漂移。查的是「一定能判定的错误」，不管风格。
        run: uv run ruff check src tests scripts evals

      - name: 单测
        run: uv run pytest

      - name: 评测集格式自检（20/20/10 配比）
        run: |
          uv run python -c "
          import sys; sys.path.insert(0, '.')
          from evals import dataset
          cases = dataset.load_suite('data/eval/suite.json')
          print(dataset.check_distribution(cases, strict=True))
          "

  frontend:
    name: 前端 · 类型检查 + 构建
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: code/agent-lab-web
    steps:
      - uses: actions/checkout@v4

      - name: 安装 Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: code/agent-lab-web/package-lock.json

      - name: 安装依赖
        # npm ci 而不是 npm install：严格按 lock 装，且会清掉 node_modules，
        # 避免「本地有残留所以能过、CI 干净环境过不了」。
        run: npm ci

      - name: 构建
        # build = vue-tsc -b && vite build，类型检查已经含在里面。
        # 不单独跑 tsc：跑两遍只有一遍的收益，还多花一倍时间。
        run: npm run build

  eval-gate:
    name: 评测门禁
    runs-on: ubuntu-latest
    timeout-minutes: 40
    needs: backend
    # 注意：GitHub Actions **不允许**在 job 级 if 里读 secrets（会直接报错），
    # 所以这里用仓库变量作为开关。开启方式：
    #   Settings → Variables → 新建 ENABLE_EVAL_GATE=true，并配好 LLM_API_KEY 等 Secrets。
    # 没配变量的仓库（比如 fork）自动跳过，不会因为缺 Key 而红一片。
    if: ${{ vars.ENABLE_EVAL_GATE == 'true' }}
    defaults:
      run:
        working-directory: code/agent-lab
    steps:
      - uses: actions/checkout@v4

      - name: 安装 uv
        uses: astral-sh/setup-uv@v5
        with:
          version: "0.8.x"
          enable-cache: true
          cache-dependency-glob: code/agent-lab/uv.lock

      - name: 安装依赖
        run: uv sync --frozen --group dev

      - name: 启动数据库
        working-directory: code
        # **只起 pgvector，不要 `up -d` 全量**：compose 里还有个 app 服务，
        # 它也占 8001，会和下一步手动起的 uvicorn 抢端口 ——
        # 表现为服务"起不来"或"起来了但连的是容器里那份数据"。
        run: docker compose up -d pgvector

      - name: 启动服务
        env:
          LLM_API_KEY: ${{ secrets.LLM_API_KEY }}
          LLM_BASE_URL: ${{ secrets.LLM_BASE_URL }}
          LLM_MODEL: ${{ secrets.LLM_MODEL }}
        # 用 ready 标志而不是"循环里 break 了就算成功"：
        # 原写法在 60 次全失败后仍会继续往下跑，最后报的是评测失败，
        # 真正原因（服务没起来）被掩盖了。
        run: |
          uv run python -m uvicorn agent_lab.app.main:app --host 127.0.0.1 --port 8001 &
          echo "等待服务就绪…"
          ready=0
          for i in $(seq 1 60); do
            if curl -sf http://127.0.0.1:8001/api/v1/health > /dev/null; then
              ready=1
              echo "服务已就绪（第 ${i} 次探测）"
              break
            fi
            sleep 2
          done
          if [ "$ready" -ne 1 ]; then
            echo "::error::服务在 120 秒内未就绪"
            exit 1
          fi

      - name: 跑评测（门禁）
        env:
          LLM_API_KEY: ${{ secrets.LLM_API_KEY }}
          LLM_BASE_URL: ${{ secrets.LLM_BASE_URL }}
          LLM_MODEL: ${{ secrets.LLM_MODEL }}
        # 通过率低于 80%、P95 超 60s、单任务成本超 0.05 元 → 退出码 1 → 阻塞合并
        run: uv run python scripts/eval_run.py --min-pass-rate 0.80 --strict-counts

      - name: 上传报告
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: eval-report
          path: code/agent-lab/data/eval/last_report.json
          if-no-files-found: ignore

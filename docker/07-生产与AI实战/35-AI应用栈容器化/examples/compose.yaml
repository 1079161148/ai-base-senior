# 第 35 章示例：典型的 AI 应用栈
# db(pgvector) + cache(redis) + agent(编排层) + tools(MCP 工具网关)
name: ch35-ai

services:
  db:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_USER: app
      POSTGRES_PASSWORD: ${DB_PASSWORD:?DB_PASSWORD 未设置}
      POSTGRES_DB: ai
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./initdb:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U app -d ai"]
      interval: 3s
      timeout: 3s
      retries: 20

  cache:
    image: redis:7-alpine
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - redisdata:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 3s
      timeout: 3s
      retries: 20

  # MCP 风格的"工具网关"：Agent 通过 HTTP 调用，而不是把工具逻辑塞进 Agent 进程
  tools:
    image: python:3.12-slim
    working_dir: /app
    volumes:
      - ./tools:/app:ro
    command: ["python", "gateway.py"]
    expose:
      - "8001"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request;urllib.request.urlopen('http://127.0.0.1:8001/healthz', timeout=2)"]
      interval: 5s
      timeout: 2s
      retries: 10

  agent:
    image: python:3.12-slim
    working_dir: /app
    volumes:
      - ./agent:/app:ro
      # 提示词模板只读挂载：改提示词不用重建镜像
      - ./prompts:/prompts:ro
    command: ["python", "agent.py"]
    environment:
      DB_HOST: db
      DB_PORT: "5432"
      REDIS_HOST: cache
      REDIS_PORT: "6379"
      TOOLS_URL: http://tools:8001
      PROMPT_DIR: /prompts
    ports:
      - "127.0.0.1:18095:8000"
    depends_on:
      db:
        condition: service_healthy
      cache:
        condition: service_healthy
      tools:
        condition: service_healthy

volumes:
  pgdata:
  redisdata:

networks:
  default:
    name: ch35-net
